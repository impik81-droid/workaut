<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Workaut — Дневник тренировок</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F1115;
            --surface: #171A21;
            --surface-2: #1D212B;
            --line: #262B36;
            --text: #F5F3EE;
            --text-dim: #8B93A7;
            --accent: #FFB238;
            --accent-ink: #241A05;
            --teal: #2DD4BF;
            --pink: #FF6FA8;
            --violet: #8B7CFF;
            --danger: #FF5470;
            --day1: #FFB238;
            --day2: #2DD4BF;
            --day3: #FF6FA8;
            --day4: #8B7CFF;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3 { font-family: 'Space Grotesk', 'Inter', sans-serif; margin: 0; }
        .app-shell {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            padding: 20px 16px 88px;
            position: relative;
        }

        /* --- Lock screen --- */
        #lockScreen {
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 16px; padding: 24px; text-align: center;
        }
        .lock-brand { font-size: 15px; letter-spacing: 0.02em; color: var(--text-dim); }
        .lock-card {
            background: var(--surface); border: 1px solid var(--line); padding: 28px 24px; border-radius: 18px;
            width: 100%; max-width: 300px;
        }
        .lock-card h1 { font-size: 24px; margin-bottom: 6px; }
        .lock-sub { font-size: 13px; color: var(--text-dim); margin-bottom: 20px; }
        .lock-input {
            width: 100%; padding: 12px; font-size: 20px; text-align: center; letter-spacing: 6px;
            border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text);
            margin-bottom: 14px; box-sizing: border-box;
        }
        .lock-input:focus { outline: none; border-color: var(--accent); }
        .lock-btn {
            width: 100%; padding: 12px; background: var(--accent); color: var(--accent-ink);
            border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
        }
        .lock-error { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 16px; }

        /* --- Views --- */
        #appContent { display: none; }
        .view { display: none; }
        .view.active { display: block; }

        .page-title { font-size: 22px; font-weight: 700; margin-bottom: 16px; }

        /* --- Дневник --- */
        .calendar-section {
            background: var(--surface); border-radius: 14px; padding: 14px; margin-bottom: 16px; border: 1px solid var(--line);
        }
        .date-picker-row input[type="date"] {
            width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px;
            background: var(--bg); color: var(--text); font-size: 14px; box-sizing: border-box; font-family: inherit;
        }
        .program-label { font-size: 12px; color: var(--text-dim); margin: 12px 0 8px; display: block; }
        .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
        .tab {
            background: var(--bg); border: 1px solid var(--line); padding: 7px 12px; border-radius: 8px; font-size: 13px;
            cursor: pointer; white-space: nowrap; flex-shrink: 0; color: var(--text); font-family: inherit;
        }
        .tab.active { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }

        .exercise-card {
            background: var(--surface); border-radius: 14px; padding: 16px; margin-bottom: 12px;
            border: 1px solid var(--line); border-left: 3px solid var(--program-color, var(--accent));
        }
        .exercise-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 4px; }
        .exercise-title { font-size: 15px; font-weight: 600; line-height: 1.3; }
        .video-btn-label {
            font-size: 12px; background: rgba(255,255,255,0.06); padding: 5px 9px; border-radius: 6px; cursor: pointer;
            color: var(--teal); white-space: nowrap; flex-shrink: 0;
        }
        .video-btn-label input { display: none; }
        .exercise-meta { font-size: 12px; color: var(--text-dim); margin-bottom: 12px; }
        .sets-grid { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
        .set-row { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.03); padding: 7px 8px; border-radius: 8px; }
        .set-label { font-size: 12px; color: var(--text-dim); width: 52px; flex-shrink: 0; }
        .set-input {
            flex: 1; padding: 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg);
            color: var(--text); font-size: 13px; text-align: center; min-width: 0; font-family: inherit;
        }
        .set-input:focus { outline: none; border-color: var(--accent); }
        .set-checkbox { width: 19px; height: 19px; cursor: pointer; accent-color: var(--accent); flex-shrink: 0; }
        .completed { opacity: 0.55; }
        .set-remove-btn {
            width: 22px; height: 22px; flex-shrink: 0; border-radius: 6px; border: none;
            background: rgba(255,84,112,0.12); color: var(--danger); font-size: 12px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; padding: 0; font-family: inherit;
        }
        .set-remove-spacer { width: 22px; flex-shrink: 0; }
        .add-set-btn {
            width: 100%; padding: 9px; margin-top: 2px; border: 1px dashed var(--line); border-radius: 8px;
            background: transparent; color: var(--text-dim); font-size: 12px; cursor: pointer; font-family: inherit;
        }
        .add-set-btn:hover { border-color: var(--accent); color: var(--accent); }

        .video-preview-container {
            margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; display: flex; align-items: center; gap: 12px;
        }
        .thumbnail-wrapper {
            position: relative; width: 68px; height: 88px; border-radius: 10px; overflow: hidden;
            background: #000; cursor: pointer; flex-shrink: 0;
        }
        .thumbnail-img { width: 100%; height: 100%; object-fit: cover; }
        .play-overlay {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 18px; background: rgba(0,0,0,0.25);
        }
        .video-info-block { flex: 1; display: flex; flex-direction: column; gap: 6px; }
        .video-actions-row { display: flex; gap: 6px; flex-wrap: wrap; }
        .action-btn {
            background: rgba(255,255,255,0.06); color: var(--text); border: none; padding: 5px 11px; border-radius: 7px;
            font-size: 11px; cursor: pointer; font-weight: 500; font-family: inherit;
        }
        .action-btn.delete { background: rgba(255,84,112,0.12); color: var(--danger); }

        #videoModal {
            display: none; position: fixed; inset: 0; background: rgba(4,5,8,0.92); z-index: 1000;
            flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;
        }
        #modalVideo { max-width: 100%; max-height: 75vh; border-radius: 12px; background: #000; }
        .close-modal-btn {
            margin-top: 16px; background: var(--text); color: #000; border: none; padding: 10px 24px;
            border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; font-family: inherit;
        }

        .comments-section { background: rgba(255,255,255,0.03); border-radius: 10px; padding: 10px; margin-top: 8px; }
        .comments-title { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
        .comment-item { font-size: 13px; background: var(--surface-2); border: 1px solid var(--line); padding: 7px 9px; border-radius: 8px; margin-bottom: 6px; }
        .comment-author { font-size: 10px; color: var(--teal); font-weight: 700; margin-bottom: 2px; }
        .comment-input-row { display: flex; gap: 6px; margin-top: 6px; }
        .comment-input {
            flex: 1; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg);
            color: var(--text); font-size: 12px; font-family: inherit;
        }
        .comment-send-btn { background: var(--accent); color: var(--accent-ink); border: none; padding: 8px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 600; font-family: inherit; }

        /* --- История --- */
        .history-card {
            background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--program-color, var(--accent));
            border-radius: 12px; padding: 14px; margin-bottom: 10px; cursor: pointer;
        }
        .history-date { font-size: 14px; font-weight: 700; }
        .history-program { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
        .history-ex-row { font-size: 13px; padding: 4px 0; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
        .history-ex-row:first-of-type { border-top: none; }
        .history-ex-name { color: var(--text); }
        .history-ex-sets { color: var(--text-dim); font-size: 12px; text-align: right; flex-shrink: 0; }
        .empty-state { text-align: center; color: var(--text-dim); font-size: 14px; padding: 40px 20px; }

        /* --- Календарь --- */
        .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .cal-nav-btn {
            background: var(--surface); border: 1px solid var(--line); color: var(--text); width: 36px; height: 36px;
            border-radius: 8px; font-size: 16px; cursor: pointer;
        }
        .cal-month-label { font-size: 16px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .cal-dow { text-align: center; font-size: 11px; color: var(--text-dim); padding-bottom: 6px; }
        .cal-day {
            aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 8px; font-size: 13px; cursor: pointer; background: var(--surface); border: 1px solid transparent; gap: 3px;
        }
        .cal-day.muted { color: var(--text-dim); opacity: 0.35; cursor: default; }
        .cal-day.today { border-color: var(--accent); }
        .cal-dots { display: flex; gap: 2px; }
        .cal-dot { width: 5px; height: 5px; border-radius: 50%; }
        .cal-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
        .cal-legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }
        .cal-legend-dot { width: 8px; height: 8px; border-radius: 50%; }

        /* --- Прогресс --- */
        .progress-select-row { margin-bottom: 14px; }
        .progress-select {
            width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
            color: var(--text); font-size: 14px; font-family: inherit; margin-top: 8px;
        }
        .chart-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
        .progress-stats { display: flex; gap: 10px; margin-top: 14px; }
        .stat-box { flex: 1; background: var(--surface-2); border-radius: 10px; padding: 10px; text-align: center; }
        .stat-value { font-size: 18px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; }
        .stat-label { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

        /* --- Нижняя навигация --- */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--line);
            display: flex; z-index: 100; padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
            padding: 10px 4px 8px; background: none; border: none; color: var(--text-dim); font-size: 10px; cursor: pointer;
            font-family: inherit;
        }
        .nav-item .nav-icon { font-size: 18px; }
        .nav-item.active { color: var(--accent); }
    </style>
</head>
<body>

    <div id="lockScreen">
        <div class="lock-brand">WORKAUT</div>
        <div class="lock-card">
            <h1>Вход</h1>
            <div class="lock-sub">Приватный дневник тренировок</div>
            <input type="text" id="nameInput" class="lock-input name-input" placeholder="Ваше имя" maxlength="30" style="text-align:left; letter-spacing:normal; font-size:15px;">
            <input type="password" id="pinInput" class="lock-input" placeholder="····" maxlength="10" inputmode="numeric">
            <button class="lock-btn" onclick="checkPassword()">Войти</button>
            <div id="lockError" class="lock-error"></div>
        </div>
    </div>

    <div id="appContent">
        <div class="app-shell">

            <!-- ДНЕВНИК -->
            <section id="view-diary" class="view active">
                <div class="page-title">Дневник тренировок</div>
                <div class="calendar-section">
                    <div class="date-picker-row">
                        <input type="date" id="workoutDate" onchange="changeDate(this.value)">
                    </div>
                    <span class="program-label">Шаблон тренировки</span>
                    <div class="tabs" id="tabsContainer"></div>
                </div>
                <div id="workoutsContainer"></div>
            </section>

            <!-- ИСТОРИЯ -->
            <section id="view-history" class="view">
                <div class="page-title">История</div>
                <div id="historyContainer"></div>
            </section>

            <!-- КАЛЕНДАРЬ -->
            <section id="view-calendar" class="view">
                <div class="page-title">Календарь</div>
                <div class="cal-header">
                    <button class="cal-nav-btn" onclick="shiftCalendarMonth(-1)">‹</button>
                    <div class="cal-month-label" id="calMonthLabel"></div>
                    <button class="cal-nav-btn" onclick="shiftCalendarMonth(1)">›</button>
                </div>
                <div class="cal-grid" id="calGrid"></div>
                <div class="cal-legend" id="calLegend"></div>
            </section>

            <!-- ПРОГРЕСС -->
            <section id="view-progress" class="view">
                <div class="page-title">Прогресс</div>
                <div class="progress-select-row">
                    <span class="program-label" style="margin-top:0;">Программа</span>
                    <div class="tabs" id="progressProgramTabs"></div>
                    <select class="progress-select" id="progressExerciseSelect" onchange="renderProgress()"></select>
                </div>
                <div class="chart-card">
                    <canvas id="progressChart" height="220"></canvas>
                </div>
                <div class="progress-stats" id="progressStats"></div>
            </section>

        </div>

        <nav class="bottom-nav">
            <button class="nav-item active" id="nav-diary" onclick="switchView('diary')">
                <span class="nav-icon">📝</span><span>Дневник</span>
            </button>
            <button class="nav-item" id="nav-history" onclick="switchView('history')">
                <span class="nav-icon">🕒</span><span>История</span>
            </button>
            <button class="nav-item" id="nav-progress" onclick="switchView('progress')">
                <span class="nav-icon">📈</span><span>Прогресс</span>
            </button>
            <button class="nav-item" id="nav-calendar" onclick="switchView('calendar')">
                <span class="nav-icon">📅</span><span>Календарь</span>
            </button>
        </nav>
    </div>

    <div id="videoModal">
        <video id="modalVideo" controls playsinline></video>
        <button class="close-modal-btn" onclick="closeVideoModal()">Закрыть</button>
    </div>

    <script>
        // Telegram WebApp — необязателен: сайт должен нормально открываться и в обычном браузере
        const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
        if (tg) { tg.ready(); tg.expand(); }

        const APP_PASSWORD = "1234";
        const APP_TOKEN = APP_PASSWORD;
        const SERVER_URL = "https://workaut.onrender.com";

        let cloudData = { dates: {}, templates: {}, comments: {}, videos: {} };

        const DISPLAY_NAME_KEY = 'workaut_display_name';

        function checkPassword() {
            const inputVal = document.getElementById('pinInput').value;
            if (inputVal === APP_PASSWORD) {
                const nameVal = document.getElementById('nameInput').value.trim();
                if (nameVal) {
                    try { localStorage.setItem(DISPLAY_NAME_KEY, nameVal); } catch (e) {}
                }
                document.getElementById('lockScreen').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
                loadCloudData();
            } else {
                document.getElementById('lockError').innerText = "Неверный пароль!";
                document.getElementById('pinInput').value = '';
            }
        }
        document.addEventListener('DOMContentLoaded', () => {
            const pinInput = document.getElementById('pinInput');
            pinInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkPassword(); });

            try {
                const savedName = localStorage.getItem(DISPLAY_NAME_KEY);
                if (savedName) document.getElementById('nameInput').value = savedName;
            } catch (e) {}
        });

        async function loadCloudData() {
            try {
                const response = await fetch(`${SERVER_URL}/api/data`, { headers: { 'x-app-token': APP_TOKEN } });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                cloudData = await response.json();
                if (!cloudData.videos) cloudData.videos = {};
                if (!cloudData.dates) cloudData.dates = {};
                if (!cloudData.templates) cloudData.templates = {};
                if (!cloudData.comments) cloudData.comments = {};
            } catch (e) {
                console.log("Ошибка загрузки с сервера", e);
            }
            initApp();
        }

        async function syncWithServer() {
            try {
                const response = await fetch(`${SERVER_URL}/api/data`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-app-token': APP_TOKEN },
                    body: JSON.stringify(cloudData)
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
            } catch (e) {
                console.log("Ошибка синхронизации", e);
            }
        }

        const programData = [
            { id: "day1", name: "День 1 (Квадры)", color: "#FFB238", exercises: [
                { name: "Сгибание ног сидя или лежа", sets: 3, target: "15 повторений" },
                { name: "Гак-присед", sets: 3, target: "12 повторений" },
                { name: "Жим ногами широко низко", sets: 3, target: "12 повторений" },
                { name: "Присед в Смите коленодомин.", sets: 3, target: "10-12 повторений" },
                { name: "Разгибание ног", sets: 3, target: "12 повторений" }
            ]},
            { id: "day2", name: "День 2 (Спина)", color: "#2DD4BF", exercises: [
                { name: "Подтягивание в гравитроне ш.хв.", sets: 3, target: "12 повторений" },
                { name: "Тяга штанги в наклоне прямым хв.", sets: 3, target: "10-12 повторений" },
                { name: "Тяга горизонтального Хаммера к груди", sets: 3, target: "12 повторений" },
                { name: "Тяга Вертикальная Шир.хв. (прожатие)", sets: 3, target: "15 повторений" },
                { name: "Тяга каната ко лбу", sets: 3, target: "15 повторений" }
            ]},
            { id: "day3", name: "День 3 (Ягодицы / Низ)", color: "#FF6FA8", exercises: [
                { name: "Сгибание ног Сидя/лежа", sets: 3, target: "12 повторений" },
                { name: "Жим ногами высоко узко", sets: 3, target: "12 повторений" },
                { name: "Ягодичный мост", sets: 3, target: "12 повторений" },
                { name: "Румынская тяга", sets: 3, target: "12 повторений" },
                { name: "Жим одной ногой высоко", sets: 3, target: "15 повторений" }
            ]},
            { id: "day4", name: "День 4 (Плечи / Грудь / Руки)", color: "#8B7CFF", exercises: [
                { name: "Отведение гантелей в стороны", sets: 3, target: "12 повторений" },
                { name: "Протяжка с грифом", sets: 3, target: "12 повторений" },
                { name: "Жим штанги сидя", sets: 3, target: "12 повторений" },
                { name: "Отжимание на полу (руки узко)", sets: 3, target: "12-15 повторений" },
                { name: "Разгибание рук с прям. рукояткой", sets: 3, target: "12-15 повторений" }
            ]}
        ];

        const getTodayStr = () => {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };
        const formatDateHuman = (dateStr) => {
            const [y, m, d] = dateStr.split('-').map(Number);
            const date = new Date(y, m - 1, d);
            return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
        };

        let selectedDate = getTodayStr();
        let activeProgramId = programData[0].id;

        // ============================= НАВИГАЦИЯ =============================
        function switchView(name) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById(`view-${name}`).classList.add('active');
            document.getElementById(`nav-${name}`).classList.add('active');
            if (name === 'history') renderHistory();
            if (name === 'calendar') renderCalendar();
            if (name === 'progress') renderProgress();
        }

        // ============================= ДНЕВНИК =============================
        window.changeDate = function(newDate) {
            if (!newDate) return;
            selectedDate = newDate;
            if (cloudData.dates[selectedDate] && cloudData.dates[selectedDate].programId) {
                activeProgramId = cloudData.dates[selectedDate].programId;
            }
            renderTabs();
            renderWorkouts();
        }

        function setProgram(progId) {
            activeProgramId = progId;
            if (!cloudData.dates[selectedDate]) cloudData.dates[selectedDate] = {};
            cloudData.dates[selectedDate].programId = progId;
            syncWithServer();
            renderTabs();
            renderWorkouts();
        }

        function getLastData(progId, exIndex, setIndex) {
            if (cloudData.templates[progId] && cloudData.templates[progId][exIndex] && cloudData.templates[progId][exIndex][setIndex]) {
                return cloudData.templates[progId][exIndex][setIndex];
            }
            return { weight: '', reps: '', checked: false };
        }

        // Количество подходов для конкретного упражнения в этот день: по умолчанию — из шаблона
        // программы (ex.sets), но пользователь может добавить/убрать подходы именно для этого дня.
        function getSetCount(dayData, exIndex, ex) {
            if (dayData[exIndex] && typeof dayData[exIndex]._count === 'number') {
                return dayData[exIndex]._count;
            }
            return ex.sets;
        }

        function ensureExerciseEntry(exIndex) {
            if (!cloudData.dates[selectedDate]) cloudData.dates[selectedDate] = { programId: activeProgramId };
            if (!cloudData.dates[selectedDate][activeProgramId]) cloudData.dates[selectedDate][activeProgramId] = {};
            if (!cloudData.dates[selectedDate][activeProgramId][exIndex]) cloudData.dates[selectedDate][activeProgramId][exIndex] = {};
            return cloudData.dates[selectedDate][activeProgramId][exIndex];
        }

        window.addSet = function(exIndex) {
            const currentProgram = programData.find(p => p.id === activeProgramId) || programData[0];
            const ex = currentProgram.exercises[exIndex];
            const dayData = cloudData.dates[selectedDate]?.[activeProgramId] || {};
            const currentCount = getSetCount(dayData, exIndex, ex);

            const entry = ensureExerciseEntry(exIndex);
            entry._count = currentCount + 1;
            // новый подход стартует пустым (можно опереться на последний введённый вес вручную)
            entry[`set_${currentCount}`] = { weight: '', reps: '', checked: false };

            syncWithServer();
            renderWorkouts();
        }

        window.removeSet = function(exIndex, setIndexToRemove) {
            const currentProgram = programData.find(p => p.id === activeProgramId) || programData[0];
            const ex = currentProgram.exercises[exIndex];
            const dayData = cloudData.dates[selectedDate]?.[activeProgramId] || {};
            const currentCount = getSetCount(dayData, exIndex, ex);
            if (currentCount <= 1) return;

            const entry = ensureExerciseEntry(exIndex);

            // Собираем текущие подходы в массив, убираем нужный, переиндексируем оставшиеся подряд
            const sets = [];
            for (let s = 0; s < currentCount; s++) {
                sets.push(entry[`set_${s}`] || getLastData(activeProgramId, exIndex, s));
            }
            sets.splice(setIndexToRemove, 1);

            // чистим старые ключи и записываем заново
            for (let s = 0; s < currentCount; s++) delete entry[`set_${s}`];
            sets.forEach((setData, i) => { entry[`set_${i}`] = setData; });
            entry._count = sets.length;

            syncWithServer();
            renderWorkouts();
        }

        // /api/stream отдаёт сам файл потоком (не JSON!) — сервер проксирует его со своего домена,

        window.updateData = function(exIndex, setIndex, field, value) {
            if (!cloudData.dates[selectedDate][activeProgramId]) cloudData.dates[selectedDate][activeProgramId] = {};
            if (!cloudData.dates[selectedDate][activeProgramId][exIndex]) cloudData.dates[selectedDate][activeProgramId][exIndex] = {};

            if (!cloudData.templates[activeProgramId]) cloudData.templates[activeProgramId] = {};
            if (!cloudData.templates[activeProgramId][exIndex]) cloudData.templates[activeProgramId][exIndex] = {};
            if (!cloudData.templates[activeProgramId][exIndex][setIndex]) cloudData.templates[activeProgramId][exIndex][setIndex] = {};

        window.toggleCheck = function(exIndex, setIndex, isChecked) {
            if (!cloudData.dates[selectedDate][activeProgramId]) cloudData.dates[selectedDate][activeProgramId] = {};
            if (!cloudData.dates[selectedDate][activeProgramId][exIndex]) cloudData.dates[selectedDate][activeProgramId][exIndex] = {};
            if (!cloudData.dates[selectedDate][activeProgramId][exIndex][`set_${setIndex}`]) {
                cloudData.dates[selectedDate][activeProgramId][exIndex][`set_${setIndex}`] = { weight: '', reps: '', checked: false };

            if (isChecked) row.classList.add('completed'); else row.classList.remove('completed');
        }

        function generateThumbnail(file) {
            return new Promise((resolve) => {
                let settled = false;
                let captured = false;

                const finish = (result) => {
                    if (settled) return;
                    settled = true;
                    clearTimeout(timeoutId);
                    try { URL.revokeObjectURL(video.src); } catch (e) {}
                    resolve(result);
                };

                // Подстраховка: на некоторых мобильных браузерах события видео (loadeddata/seeked)
                // для только что снятого на камеру файла могут вообще не сработать — тогда просто
                // продолжаем без превью, а не зависаем в ожидании навсегда.
                const timeoutId = setTimeout(() => finish(null), 6000);

                const video = document.createElement('video');
                video.preload = 'metadata';
                video.muted = true;
                video.playsInline = true;
                video.src = URL.createObjectURL(file);

                function capture() {
                    if (captured || settled) return;
                    captured = true;
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = 140; canvas.height = 180;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        canvas.toBlob((blob) => finish(blob), 'image/jpeg', 0.7);
                    } catch (e) {
                        finish(null);
                    }
                }

                video.addEventListener('loadedmetadata', () => {
                    try { video.currentTime = Math.min(0.5, (video.duration || 1) / 2); }
                    catch (e) { capture(); }
                });
                video.addEventListener('seeked', capture);
                video.addEventListener('loadeddata', capture);
                video.addEventListener('error', () => finish(null));
            });
        }

        window.handleVideo = async function(event, exIndex) {
            const file = event.target.files[0];
            if (!file) return;

            const itemKey = `${selectedDate}_${activeProgramId}_${exIndex}`;
            const labelEl = document.getElementById(`label_${exIndex}`);
            if (labelEl) labelEl.innerHTML = '⏳ Загрузка...';

            const thumbBlob = await generateThumbnail(file);
            const formData = new FormData();
            formData.append('key', itemKey);
            formData.append('video', file, file.name || 'video.mp4');
            if (thumbBlob) formData.append('thumbnail', thumbBlob, 'thumb.jpg');

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 10 * 60 * 1000);
            try {
                const response = await fetch(`${SERVER_URL}/api/workout`, {
                    method: 'POST',
                    headers: { 'x-app-token': APP_TOKEN },
                    body: formData,
                    signal: controller.signal
                });
                const result = await response.json().catch(() => ({}));
                if (!response.ok || !result.success) {
                    throw new Error(result.error || `HTTP ${response.status}`);
                }

                // Сервер уже записал videoPaths и подтвердил операцию. Получаем
                // актуальное состояние заново, чтобы не перезаписать его старым снимком.
                await loadCloudData();
            } catch (err) {
                if (err.name === 'AbortError') {
                    alert('Загрузка видео заняла слишком много времени. Проверьте интернет и попробуйте ещё раз.');
                } else {
                    alert('Не удалось сохранить видео: ' + (err.message || 'ошибка сервера'));
                }
                renderWorkouts();
            } finally {
                clearTimeout(timeoutId);
                if (labelEl && document.body.contains(labelEl)) {
                    labelEl.innerHTML = `📷 ${cloudData.videos[itemKey] ? 'Заменить' : 'Видео'}<input type="file" accept="video/*" onchange="handleVideo(event, ${exIndex})">`;
                }
                event.target.value = '';
            }
        }

        window.deleteVideo = async function(exIndex) {
            const itemKey = `${selectedDate}_${activeProgramId}_${exIndex}`;
            try {
                const response = await fetch(`${SERVER_URL}/api/delete-video`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-app-token': APP_TOKEN },
                    body: JSON.stringify({ key: itemKey })
                });
                const result = await response.json().catch(() => ({}));
                if (!response.ok || !result.success) {
                    throw new Error(result.error || `HTTP ${response.status}`);
                }
                await loadCloudData();
            } catch (e) {
                alert('Не удалось удалить видео: ' + (e.message || 'ошибка сервера'));
                renderWorkouts();
            }
        }

        window.addComment = function(exIndex) {
            const input = document.getElementById(`commInput_${exIndex}`);
            const text = input.value.trim();
            if (!text) return;

            const itemKey = `${selectedDate}_${activeProgramId}_${exIndex}`;
            if (!cloudData.comments[itemKey]) cloudData.comments[itemKey] = [];

            const user = tg?.initDataUnsafe?.user;
            let authorName = user && user.first_name ? user.first_name : null;
            if (!authorName) {
                try { authorName = localStorage.getItem(DISPLAY_NAME_KEY); } catch (e) {}
            }
            if (!authorName) authorName = "Гость";

            cloudData.comments[itemKey].push({ author: authorName, text: text });
            syncWithServer();
            input.value = '';
            renderWorkouts();
        }

        // ============================= ИСТОРИЯ =============================
        function dateHasData(dateEntry) {
            if (!dateEntry) return false;
            return programData.some(prog => {
                const progData = dateEntry[prog.id];
                if (!progData) return false;
                return Object.values(progData).some(ex =>
                    Object.values(ex).some(set => (set.weight || set.reps || set.checked))
                );
            });
        }

        function renderHistory() {
            const container = document.getElementById('historyContainer');
            const dateKeys = Object.keys(cloudData.dates)
                .filter(d => dateHasData(cloudData.dates[d]))
                .sort((a, b) => b.localeCompare(a));

            if (dateKeys.length === 0) {
                container.innerHTML = `<div class="empty-state">Пока нет записанных тренировок.<br>Заполните подходы в «Дневнике» — они появятся здесь.</div>`;
                return;
            }

            container.innerHTML = '';
            dateKeys.forEach(dateStr => {
                const dateEntry = cloudData.dates[dateStr];
                programData.forEach(prog => {
                    const progData = dateEntry[prog.id];
                    if (!progData) return;
                    const filledExercises = prog.exercises
                        .map((ex, exIndex) => ({ ex, exIndex, sets: progData[exIndex] }))

        // ============================= КАЛЕНДАРЬ =============================
        let calendarMonth = new Date(selectedDate);
        calendarMonth.setDate(1);

        function shiftCalendarMonth(delta) {
            calendarMonth.setMonth(calendarMonth.getMonth() + delta);
            renderCalendar();
        }

        function renderCalendar() {
            const label = document.getElementById('calMonthLabel');
            label.innerText = calendarMonth.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });

            const grid = document.getElementById('calGrid');
            grid.innerHTML = '';
            ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(d => {
                const el = document.createElement('div');
                el.className = 'cal-dow';
                el.innerText = d;
                grid.appendChild(el);
            });

            const year = calendarMonth.getFullYear();
            const month = calendarMonth.getMonth();
            const firstDay = new Date(year, month, 1);
            let startOffset = firstDay.getDay() - 1;
            if (startOffset < 0) startOffset = 6;
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const todayStr = getTodayStr();

            for (let i = 0; i < startOffset; i++) {
                const el = document.createElement('div');
                el.className = 'cal-day muted';
                grid.appendChild(el);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dateEntry = cloudData.dates[dateStr];
                const el = document.createElement('div');
                el.className = 'cal-day' + (dateStr === todayStr ? ' today' : '');

                const dotsWrap = document.createElement('div');
                dotsWrap.className = 'cal-dots';
                const dayNum = document.createElement('div');
                dayNum.innerText = day;

                if (dateEntry && dateHasData(dateEntry)) {
                    programData.forEach(prog => {
                        const progData = dateEntry[prog.id];
                        if (progData && Object.values(progData).some(ex => Object.values(ex).some(s => s.weight || s.reps || s.checked))) {
                            const dot = document.createElement('div');
                            dot.className = 'cal-dot';
                            dot.style.background = prog.color;
                            dotsWrap.appendChild(dot);
                        }
                    });
                    el.onclick = () => {
                        selectedDate = dateStr;
                        activeProgramId = (dateEntry.programId) || activeProgramId;
                        document.getElementById('workoutDate').value = dateStr;
                        renderTabs();
                        renderWorkouts();
                        switchView('diary');
                    };
                } else {
                    el.onclick = () => {
                        selectedDate = dateStr;
                        document.getElementById('workoutDate').value = dateStr;
                        renderTabs();
                        renderWorkouts();
                        switchView('diary');
                    };
                }

                el.appendChild(dayNum);
                el.appendChild(dotsWrap);
                grid.appendChild(el);
            }

            const legend = document.getElementById('calLegend');
            legend.innerHTML = programData.map(p => `
                <div class="cal-legend-item">
                    <div class="cal-legend-dot" style="background:${p.color}"></div>
                    <span>${p.name}</span>
                </div>
            `).join('');
        }

        // ============================= ПРОГРЕСС =============================
        let progressProgramId = programData[0].id;
        let progressChartInstance = null;

        function renderProgressProgramTabs() {
            const container = document.getElementById('progressProgramTabs');
            container.innerHTML = '';
            programData.forEach(prog => {
                const btn = document.createElement('div');
                btn.className = `tab ${prog.id === progressProgramId ? 'active' : ''}`;

        function populateExerciseSelect() {
            const select = document.getElementById('progressExerciseSelect');
            const prog = programData.find(p => p.id === progressProgramId);
            select.innerHTML = prog.exercises.map((ex, i) => `<option value="${i}">${ex.name}</option>`).join('');
        }

        function renderProgress() {
            const prog = programData.find(p => p.id === progressProgramId);
            const exIndex = parseInt(document.getElementById('progressExerciseSelect').value || 0, 10);

            const dateKeys = Object.keys(cloudData.dates).sort((a, b) => a.localeCompare(b));
            const points = [];

            dateKeys.forEach(dateStr => {
                const entry = cloudData.dates[dateStr];
                const progData = entry[progressProgramId];
                if (!progData || !progData[exIndex]) return;
                const sets = Object.values(progData[exIndex]);
                let bestWeight = 0, bestReps = 0;
                sets.forEach(s => {
                    const w = parseFloat(s.weight) || 0;
                    const r = parseFloat(s.reps) || 0;
                    if (w > bestWeight) bestWeight = w;
                    if (r > bestReps) bestReps = r;
                });
                if (bestWeight > 0 || bestReps > 0) {
                    points.push({ date: dateStr, weight: bestWeight, reps: bestReps });
                }
            });

            const ctx = document.getElementById('progressChart').getContext('2d');
            if (progressChartInstance) progressChartInstance.destroy();

            const statsContainer = document.getElementById('progressStats');
            if (points.length === 0) {
                statsContainer.innerHTML = `<div class="empty-state" style="padding:12px 4px;">Нет данных по этому упражнению — заполните вес и повторения в «Дневнике».</div>`;
                progressChartInstance = new Chart(ctx, { type: 'line', data: { labels: [], datasets: [] } });
                return;
            }

            progressChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: points.map(p => formatDateHuman(p.date).replace(/ \d{4}\u00A0?г\.?/, '').replace(/ \d{4}$/, '')),
                    datasets: [{
                        label: 'Лучший вес, кг',
                        data: points.map(p => p.weight),
                        borderColor: prog.color,
                        backgroundColor: prog.color + '33',
                        tension: 0.3,
                        fill: true,
                        pointRadius: 4,
                        pointBackgroundColor: prog.color
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { labels: { color: '#8B93A7' } } },
                    scales: {
                        x: { ticks: { color: '#8B93A7' }, grid: { color: '#262B36' } },
                        y: { ticks: { color: '#8B93A7' }, grid: { color: '#262B36' }, beginAtZero: true }
                    }
                }
            });

            const first = points[0], last = points[points.length - 1];
            const diff = (last.weight - first.weight).toFixed(1);
            const diffText = diff > 0 ? `+${diff} кг` : `${diff} кг`;

            statsContainer.innerHTML = `
                <div class="stat-box">
                    <div class="stat-value">${last.weight} кг</div>
                    <div class="stat-label">Текущий рабочий вес</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value">${diffText}</div>
                    <div class="stat-label">С первой записи</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value">${points.length}</div>
                    <div class="stat-label">Тренировок с данными</div>
                </div>
            `;
        }

        function initApp() {
            document.getElementById('workoutDate').value = selectedDate;
            renderTabs();
            renderWorkouts();
            renderProgressProgramTabs();
            populateExerciseSelect();
        }
    </script>
</body>
</html>
